{% extends 'base.html' %}
{% block content %}
<h3>Ocorrências</h3>
<form method="post" class="row g-2 mb-3">
  <div class="col-md-2"><select name="funcionario_id" class="form-select" required>{% for f in funcionarios %}<option value="{{ f.id }}">{{ f.nome }}</option>{% endfor %}</select></div>
  <div class="col-md-2"><select name="tipo" class="form-select"><option>Falta</option><option>Férias</option><option>Abono</option><option>Licença</option></select></div>
  <div class="col-md-2"><input type="date" name="data_inicio" class="form-control" required></div>
  <div class="col-md-2"><input type="date" name="data_fim" class="form-control" required></div>
  <div class="col-md-3"><input name="observacoes" class="form-control" placeholder="Observações"></div>
  <div class="col-md-1"><button class="btn btn-success w-100">Salvar</button></div>
</form>
<table class="table table-striped table-sm"><tr><th>Funcionário</th><th>Tipo</th><th>Período</th><th>Obs.</th></tr>
{% for o in ocorrencias %}<tr><td>{{ o.funcionario_nome }}</td><td>{{ o.tipo }}</td><td>{{ o.data_inicio }} até {{ o.data_fim }}</td><td>{{ o.observacoes }}</td></tr>{% endfor %}</table>
{% endblock %}
